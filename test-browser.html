<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Browser Build</title>
</head>
<body>
    <h1>Testing Browser Build</h1>
    <div id="output"></div>
    
    <script type="module">
        // Test ES module import
        import('./dist/browser/forge-expr-evaluator.es.js')
            .then(module => {
                console.log('ES Module loaded:', module);
                document.getElementById('output').innerHTML += '<p>✅ ES Module loaded successfully!</p>';
                
                // Test that main exports are available
                if (module.ForgeExprEvaluatorUtil) {
                    document.getElementById('output').innerHTML += '<p>✅ ForgeExprEvaluatorUtil class is available</p>';
                }
                
                // Test basic instantiation (will fail without data, but should not throw import errors)
                try {
                    const evaluator = new module.ForgeExprEvaluatorUtil({}, '');
                    document.getElementById('output').innerHTML += '<p>✅ Can instantiate ForgeExprEvaluatorUtil</p>';
                } catch (error) {
                    // Expected to fail due to missing data, but should not be import-related
                    if (error.message.includes('Cannot find module') || error.message.includes('require')) {
                        document.getElementById('output').innerHTML += '<p>❌ Import error: ' + error.message + '</p>';
                    } else {
                        document.getElementById('output').innerHTML += '<p>✅ No import errors (runtime error is expected)</p>';
                    }
                }
            })
            .catch(error => {
                console.error('Failed to load ES module:', error);
                document.getElementById('output').innerHTML += '<p>❌ Failed to load ES module: ' + error.message + '</p>';
            });
    </script>
    
    <!-- Test UMD build -->
    <script src="./dist/browser/forge-expr-evaluator.umd.js"></script>
    <script>
        // Test UMD global
        if (typeof ForgeExprEvaluator !== 'undefined') {
            document.getElementById('output').innerHTML += '<p>✅ UMD build loaded successfully!</p>';
            
            if (ForgeExprEvaluator.ForgeExprEvaluatorUtil) {
                document.getElementById('output').innerHTML += '<p>✅ UMD ForgeExprEvaluatorUtil class is available</p>';
                
                try {
                    const evaluator = new ForgeExprEvaluator.ForgeExprEvaluatorUtil({}, '');
                    document.getElementById('output').innerHTML += '<p>✅ Can instantiate UMD ForgeExprEvaluatorUtil</p>';
                } catch (error) {
                    if (error.message.includes('Cannot find module') || error.message.includes('require')) {
                        document.getElementById('output').innerHTML += '<p>❌ UMD Import error: ' + error.message + '</p>';
                    } else {
                        document.getElementById('output').innerHTML += '<p>✅ UMD No import errors (runtime error is expected)</p>';
                    }
                }
            }
        } else {
            document.getElementById('output').innerHTML += '<p>❌ UMD build not available</p>';
        }
    </script>
</body>
</html>
