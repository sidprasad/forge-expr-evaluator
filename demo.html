<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forge Expression Evaluator Demo</title>
</head>
<body>
    <h1>Forge Expression Evaluator</h1>
    <div>
        <h2>Test Expression:</h2>
        <textarea id="forgeInput" rows="5" cols="50">
some Room {
    no Person
}</textarea>
        <br><br>
        <button onclick="evaluateExpression()">Evaluate</button>
    </div>
    <div>
        <h2>Result:</h2>
        <pre id="result"></pre>
    </div>

    <script src="./dist/forge-expr-evaluator.bundle.js"></script>
    <script>
        function evaluateExpression() {
            const input = document.getElementById('forgeInput').value;
            const resultDiv = document.getElementById('result');
            
            try {
                // Test that the library loads and can create a parser
                const parser = ForgeExprEvaluator.ForgeExprEvaluatorUtil.createForgeParser(input);
                resultDiv.textContent = "✅ Bundle loaded successfully!\nParser created for input: " + input.substring(0, 50) + "...";
            } catch (error) {
                resultDiv.textContent = "❌ Error: " + error.message;
            }
        }
        
        // Test on page load
        window.onload = function() {
            document.getElementById('result').textContent = "✅ Bundle loaded successfully! Library available as: " + typeof ForgeExprEvaluator;
        };
    </script>
</body>
</html>
