<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forge Expression Evaluator Demo</title>
</head>
<body>
    <h1>Forge Expression Evaluator</h1>
    <div>
        <h2>Test Expression:</h2>
        <textarea id="forgeInput" rows="5" cols="50">
some Room {
    no Person
}</textarea>
        <br><br>
        <button onclick="evaluateExpression()">Evaluate</button>
    </div>
    <div>
        <h2>Result:</h2>
        <pre id="result"></pre>
    </div>

    <script src="./dist/forge-expr-evaluator.bundle.js"></script>
    <script>
        function evaluateExpression() {
            const input = document.getElementById('forgeInput').value;
            const resultDiv = document.getElementById('result');
            
            try {
                // Check if the library is available
                console.log('ForgeExprEvaluator object:', ForgeExprEvaluator);
                console.log('Available exports:', Object.keys(ForgeExprEvaluator));
                
                // Test that the library loads and can create a ForgeExprEvaluatorUtil
                const evaluatorUtil = new ForgeExprEvaluator.ForgeExprEvaluatorUtil({}, input);
                resultDiv.textContent = "✅ Bundle loaded successfully!\nForgeExprEvaluatorUtil created for input: " + input.substring(0, 50) + "...";
            } catch (error) {
                resultDiv.textContent = "❌ Error: " + error.message;
                console.error('Full error:', error);
            }
        }
        
        // Test on page load
        window.onload = function() {
            try {
                console.log('Window ForgeExprEvaluator:', typeof ForgeExprEvaluator, ForgeExprEvaluator);
                document.getElementById('result').textContent = "✅ Bundle loaded successfully! Library available as: " + typeof ForgeExprEvaluator + "\nExports: " + Object.keys(ForgeExprEvaluator).join(', ');
            } catch (error) {
                document.getElementById('result').textContent = "❌ Bundle loading failed: " + error.message;
                console.error('Bundle load error:', error);
            }
        };
    </script>
</body>
</html>
